# Configuration de la stack Supabase LOCALE (`supabase start`, plan
# environnement-dev-docker-2026-10-12, étape 2). Seules les clés qui diffèrent
# des défauts de la CLI (2.120.0) sont écrites ; le modèle complet s'obtient
# par `supabase init` dans un dossier temporaire.
#
# ⚠ Ce fichier ne part PAS en prod (seule la section [functions.*] est lue par
# `functions deploy`). Bucket, policies, réglages de rôles : en MIGRATION.
# Réglages Auth de la prod (dashboard) : relevés dans
# plan/environnement-dev-docker-2026-10-12/releve-prod.md, reportés ici.

project_id = "back-office"

[api]
# JAMAIS `private` : ce schéma porte les fonctions security definer, il ne
# doit pas être exposé à PostgREST (même règle qu'en prod).
schemas = ["public", "graphql_public"]

[db]
major_version = 17

[db.seed]
sql_paths = ["./seed.sql"]

[storage]
# Bucket le plus gros : classeur-images, 20 Mo (originaux).
file_size_limit = "20MiB"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
# Prod : inscriptions fermées, comptes créés par l'Edge Function create-user
# (API admin, non concernée par ce réglage) ou par le seed.
enable_signup = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = false
# Les e-mails d'Auth partent dans Mailpit (http://127.0.0.1:54324).
enable_confirmations = false

[analytics]
enabled = false

# Réglages de déploiement des Edge Functions, FIGÉS dans le repo — pour que
# `import-report` garde verify_jwt=false à CHAQUE déploiement, sans dépendre du flag
# `--no-verify-jwt` (oubliable : un deploy sans le flag réactive la vérif JWT -> 401
# depuis le Worker Cloudflare -> pipeline auto MORT, en silence).
#
# import-report est appelée par le Worker Cloudflare (pas par un utilisateur connecté)
# -> PAS de JWT à vérifier : la barrière est le secret `X-Import-Secret`, vérifié dans
# le code (comparaison en temps constant).
#
# Les autres fonctions (send-report, create-user, delete-user) gardent le défaut
# verify_jwt = true (appelées avec le JWT admin) — inutile de les lister ici.
[functions.import-report]
verify_jwt = false
