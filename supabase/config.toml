# Réglages de déploiement des Edge Functions, FIGÉS dans le repo — au lieu de dépendre
# du flag `--no-verify-jwt` en ligne de commande, oubliable (un `supabase functions
# deploy import-report` sans le flag réactivait la vérif JWT → 401 en boucle depuis le
# Worker → imports et RepJour perdus silencieusement).
#
# import-report est appelée par le Worker Cloudflare (pas par un utilisateur connecté)
# → PAS de JWT à vérifier : la barrière est le secret `X-Import-Secret`, vérifié dans le
# code (comparaison en temps constant). Avec ce réglage, `--no-verify-jwt` devient inutile
# (mais reste sans effet néfaste si conservé par habitude).
#
# Les autres fonctions (send-report, create-user, delete-user) gardent le défaut
# verify_jwt = true (appelées avec le JWT admin) — inutile de les lister ici.
[functions.import-report]
verify_jwt = false
